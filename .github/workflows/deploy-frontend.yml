name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "configs/tunnel.env.example"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "NEXT_PUBLIC_API_BASE_URL override (optional)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install and deploy
        working-directory: apps/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          npm ci
          npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
